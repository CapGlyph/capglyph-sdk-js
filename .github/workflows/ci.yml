name: CI — capglyph-sdk-js

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capglyph-sdk-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: capglyph-sdk-js
      - uses: actions/checkout@v7
        with:
          repository: CapGlyph/capglyph-test-vectors
          path: capglyph-test-vectors

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capglyph-sdk-js/package.json

      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          CAPGLYPH_VECTORS: ../capglyph-test-vectors/vectors
